<script>
const DATA = [{"q": "Cosa significa che un'allocazione e' Pareto-efficiente?", "options": ["Il governo ha stabilito la distribuzione", "E' la ripartizione piu' equa tra tutti gli individui", "Tutti gli individui ricevono la stessa quantita' di beni", "Non puo' essere migliorata senza peggiorare la situazione di qualcuno"], "answer": 3, "explanation": "Asignacion pareto-eficiente: non si puo' migliorare nessuno senza peggiorare qualcun altro. Non implica equita'.", "ch": 1}, {"q": "L'Economia del Benessere (Economia del Bienestar) e' la branca che si occupa di:", "options": ["Aspetti normativi: valutare come funziona l'economia", "Solo descrivere come funziona l'economia", "Calcolare i costi di produzione delle imprese", "Prevedere l'inflazione"], "answer": 0, "explanation": "Secondo le slide tratta aspetti normativi: il suo scopo non e' solo descrivere ma valutare come funziona l'economia.", "ch": 1}, {"q": "Quale tra questi NON e' elencato come fallimento di mercato (fallo de mercado) nelle slide?", "options": ["Esternalita' e beni pubblici", "Concorrenza perfetta", "Mercati inesistenti", "Informazione imperfetta"], "answer": 1, "explanation": "La concorrenza perfetta e' il caso efficiente. I fallimenti sono: concorrenza imperfetta, esternalita'/beni pubblici, informazione imperfetta, fluttuazioni estreme, mercati inesistenti.", "ch": 1}, {"q": "Il surplus del consumatore (excedente del consumidor) e' graficamente:", "options": ["L'area tra domanda e offerta oltre Qc", "L'area sopra la curva di offerta e sotto il prezzo", "L'area sotto la curva di domanda e sopra il prezzo", "Il rettangolo prezzo x quantita'"], "answer": 2, "explanation": "EC = area sotto la domanda e sopra il prezzo pagato, fino alla quantita' scambiata.", "ch": 1}, {"q": "Con D: P = 100 - Q e S: P = 20 + Q, quali sono quantita' e prezzo di equilibrio?", "options": ["Q = 30, P = 70", "Q = 80, P = 20", "Q = 40, P = 60", "Q = 50, P = 50"], "answer": 2, "explanation": "100 - Q = 20 + Q implica Q = 40; P = 60.", "ch": 1}, {"q": "Con D: P = 100 - Q, S: P = 20 + Q ed equilibrio Q = 40, P = 60, quanto vale il surplus totale?", "options": ["3200", "800", "1600", "2400"], "answer": 2, "explanation": "EC = 40*40/2 = 800; EP = 40*40/2 = 800; totale 1600.", "ch": 1}, {"q": "Perche' la concorrenza perfetta massimizza il surplus totale?", "options": ["Perche' lo Stato fissa il prezzo", "Perche' il prezzo e' il piu' basso possibile per i produttori", "Perche' le imprese non hanno profitti", "Perche' si producono tutte e solo le unita' il cui valore per i consumatori supera il costo"], "answer": 3, "explanation": "Fino a Qc il valore (domanda) supera il costo (offerta); oltre Qc succede il contrario. Il massimo e' dove D = S.", "ch": 1}, {"q": "Secondo le slide, qual e' il costo sociale del monopolio?", "options": ["La quantita' offerta troppo bassa e il prezzo troppo alto", "Il profitto elevato del monopolista", "La mancanza di leggi antitrust", "Il fatto che sia un'impresa privata"], "answer": 0, "explanation": "Il costo sociale e' dato da scarsa quantita' e prezzo eccessivo, non dal profitto: conta la dimensione della torta, non la sua divisione.", "ch": 1}, {"q": "La domanda e' Q = 120 - 2P. Qual e' l'intercetta sull'asse del prezzo (prezzo massimo disposto a pagare)?", "options": ["60", "240", "30", "120"], "answer": 0, "explanation": "Con Q = 0: 2P = 120, quindi P = 60. Errore tipico: dare 120 come intercetta sul prezzo.", "ch": 1}, {"q": "Con quantita' scambiata 30 (invece di Qc = 40), domanda P = 100 - Q e offerta P = 20 + Q, quanto vale la perdita secca (pérdida de eficiencia)?", "options": ["400", "200", "100", "50"], "answer": 2, "explanation": "Triangolo: base = 40 - 30 = 10; altezza = (100-30) - (20+30) = 70 - 50 = 20; area = 10*20/2 = 100.", "ch": 1}, {"q": "Quale combinazione descrive la competencia monopolística secondo la slide 4?", "options": ["Una sola impresa, prodotto único", "Varie imprese, prodotti simili o identici", "Molte imprese, prodotti simili (differenziati)", "Molte imprese, prodotti identici"], "answer": 2, "explanation": "Competencia monopolística = muchas empresas con productos similares (differenziati). Monopolio = 1 impresa e prodotto único; oligopolio = varias imprese; competencia perfecta = muchas imprese e prodotti idénticos.", "ch": 2}, {"q": "Quale NON è una delle tre barriere all'entrata elencate nella slide sui monopoli?", "options": ["Risorse di proprietà di una sola impresa", "Monopoli naturali", "Monopoli pubblici", "Pubblicità e marchi"], "answer": 3, "explanation": "Le tre barriere sono: recursos propiedad de una sola empresa, monopolios públicos e monopolios naturales. Pubblicità e marchi riguardano la competencia monopolística.", "ch": 2}, {"q": "Quando la produzione di un bene è un monopolio naturale?", "options": ["Quando il prodotto è identico a quello dei concorrenti", "Quando lo Stato riserva per legge l'attività a un ente pubblico", "Quando una sola impresa ha costi medi minori che con due o più imprese (economie di scala su un intervallo importante)", "Quando l'impresa possiede in esclusiva la materia prima"], "answer": 2, "explanation": "Definizione della slide: costes unitarios o medios menores producendo con una sola impresa, grazie alle economías de escala. L'opzione sullo Stato descrive un monopolio pubblico, quella sulla materia prima una barriera di risorse.", "ch": 2}, {"q": "Secondo la slide, qual è il coste social del monopolio?", "options": ["La scarsa quantità offerta e l'eccessivo prezzo pagato", "Il trasferimento di surplus dai consumatori al produttore", "L'obbligo di pagare le imposte antitrust", "Il profitto ottenuto dal monopolista"], "answer": 0, "explanation": "Il costo sociale deriva da quantità troppo bassa e prezzo troppo alto, non dal profitto. Il trasferimento cambia solo chi ha i soldi: conta la dimensione della torta, non la spartizione.", "ch": 2}, {"q": "Confrontando monopolio e concorrenza perfetta (Pm, Qm, Pc, Qc), che cosa vale?", "options": ["Pm < Pc e Qm > Qc", "Pm > Pc e Qm > Qc", "Pm = Pc e Qm < Qc", "Pm > Pc e Qm < Qc"], "answer": 3, "explanation": "Il monopolista produce meno e vende a un prezzo più alto: Pm > Pc e Qm < Qc.", "ch": 2}, {"q": "Quali sono la ley Sherman e la ley Clayton (slide 9)?", "options": ["Leggi europee del 1957 e del 1992", "Leggi sulla proprietà pubblica del 1890 e del 1914", "Leggi di regolazione dei prezzi del 1914 e del 1890", "Leggi statunitensi antitrust del 1890 e del 1914"], "answer": 3, "explanation": "Sherman (1890) e Clayton (1914) sono le leggi antitrust statunitensi; esempi citati: AT&T e Microsoft.", "ch": 2}, {"q": "Quali sono i due problemi della regolazione dei prezzi di un monopolio naturale indicati nella slide?", "options": ["Eccesso di profitti e aumento della concorrenza", "Pérdidas (rimedio: sussidi) e mancanza di incentivi a ridurre i costi", "Perdita secca e fallo político", "Riduzione della quantità e aumento delle imposte"], "answer": 1, "explanation": "Con prezzo regolato (vicino al costo marginale) il monopolio naturale può avere perdite, risolvibili con subvenciones, e non ha incentivi a ridurre i costi.", "ch": 2}, {"q": "Che cosa significa 'fallo político' nella politica 'no hacer nada'?", "options": ["Il monopolista ha troppo potere politico", "Il mercato non raggiunge l'efficienza", "L'Unione Europea vieta l'intervento", "L'intervento pubblico può costare più del danno che vuole correggere"], "answer": 3, "explanation": "Fallo de mercado = il mercato da solo è inefficiente; fallo político = l'intervento pubblico può avere costi maggiori dei danni, quindi a volte non fare nulla è preferibile.", "ch": 2}, {"q": "Offerta Qs = 4p e domanda Qd = 20 - p in concorrenza perfetta. Qual è l'equilibrio?", "options": ["p = 4, Q = 20", "p = 5, Q = 15", "p = 4, Q = 16", "p = 3,2, Q = 12,8"], "answer": 2, "explanation": "20 - p = 4p, quindi 5p = 20 e p = 4. Q = 20 - 4 = 16 (controllo: 4·4 = 16).", "ch": 2}, {"q": "Stesso mercato (Qs = 4p, Qd = 20 - p). Un monopolista fissa p = 8. Quanti pezzi si vendono e dove si legge la quantità?", "options": ["Q = 12, sulla domanda", "Q = 32, sull'offerta", "Q = 12, sull'offerta", "Q = 16, nell'equilibrio di concorrenza"], "answer": 0, "explanation": "I consumatori decidono quanto comprare al prezzo fissato: si legge sulla domanda, Q = 20 - 8 = 12. Sull'offerta Qs(8) = 32 non ha senso: è quanto offrirebbero le imprese concorrenziali.", "ch": 2}, {"q": "Con Qs = 4p, Qd = 20 - p e monopolio a p = 8 (Q = 12), quanto vale la perdita di efficienza (perdita secca)?", "options": ["20", "48", "10", "5"], "answer": 2, "explanation": "Inverse: domanda p = 20 - Q, offerta p = Q/4. Con Q = 12 la domanda dà 8 e l'offerta 3. Qc = 16. Perdita = 1/2 · (8 - 3) · (16 - 12) = 10. Errore tipico: usare 8 - 4 come base e ottenere 8 (parte consumatori).", "ch": 2}, {"q": "Stessi dati (Qs = 4p, Qd = 20 - p, p = 8, Q = 12; concorrenza p = 4, Q = 16). Quanto vale il trasferimento dai consumatori al produttore e quanto la perdita totale di surplus dei consumatori?", "options": ["Trasferimento 10, perdita totale dei consumatori 48", "Trasferimento 48, perdita totale dei consumatori 128", "Trasferimento 48, perdita totale dei consumatori 56", "Trasferimento 56, perdita totale dei consumatori 48"], "answer": 2, "explanation": "Trasferimento = (8 - 4)·12 = 48. EC concorrenza = 1/2·(20-4)·16 = 128; EC monopolio = 1/2·(20-8)·12 = 72; perdita = 56 = 48 + 8, dove 8 = 1/2·(8-4)·(16-12) è la parte consumatori della perdita secca.", "ch": 2}, {"q": "Un mercato ha molti venditori di jeans di marche diverse, libera entrata e domanda inclinata negativamente per ciascuna impresa. Di che forma di mercato si tratta?", "options": ["Concorrenza perfetta", "Oligopolio", "Monopolio", "Concorrenza monopolistica"], "answer": 3, "explanation": "Molte imprese, prodotto differenziato (marche) e libera entrata caratterizzano la competencia monopolística.", "ch": 3}, {"q": "Quale dei seguenti è il caso più vicino all'oligopolio?", "options": ["I parrucchieri di un quartiere", "Il vicino che vende uova", "Le bancarelle di verdura di un mercato", "Le compagnie che producono aerei di linea"], "answer": 3, "explanation": "Pochissime imprese, barriere altissime e decisioni interdipendenti: oligopolio.", "ch": 3}, {"q": "Nella tabella del duopolio (CMg = 10, domanda Q = 120 - P), quale è il risultato della concorrenza perfetta?", "options": ["P = 10, Q = 110", "P = 0, Q = 120", "P = 60, Q = 60", "P = 120, Q = 0"], "answer": 0, "explanation": "In concorrenza perfetta P = CMg = 10, quindi Q = 120 - 10 = 110 e il profitto è zero.", "ch": 3}, {"q": "Secondo la slide, a quale prezzo e quantità si colloca il duopolio cooperativo?", "options": ["P = 10, Q = 110", "P = 60, Q = 60", "P = 30, Q = 90", "P = 100, Q = 20"], "answer": 1, "explanation": "Il cartello si comporta come un monopolista: P = 60, Q = 60 (ricavo massimo 3600).", "ch": 3}, {"q": "Nella tabella con CMg = 10, qual è il profitto (P-10)*Q a P = 60?", "options": ["3000", "2500", "1100", "3600"], "answer": 0, "explanation": "(60-10)*60 = 3000. Il 3600 è il ricavo, non il profitto.", "ch": 3}, {"q": "Con CMg = 10 e P = 120 - Q, quale coppia massimizza esattamente il profitto del monopolista/cartello (IMg = CMg)?", "options": ["Q = 60, P = 60", "Q = 50, P = 70", "Q = 55, P = 65", "Q = 110, P = 10"], "answer": 2, "explanation": "IMg = 120 - 2Q = 10 dà Q = 55, P = 65, profitto 3025. Nella tabella a passi di 10, 60 e 70 danno entrambi 3000.", "ch": 3}, {"q": "Che cosa è una colusión?", "options": ["Una fusione obbligatoria decisa dallo Stato", "Un accordo tra imprese per ripartirsi il mercato e comportarsi come un monopolista", "Un sussidio pubblico a un monopolio naturale", "Una riduzione dei prezzi per attirare clienti"], "answer": 1, "explanation": "Il cartello (cártel) è un gruppo di imprese in collusione: l'oligopolio cooperativo dà lo stesso risultato del monopolio.", "ch": 3}, {"q": "Perché i cartelli sono instabili (dilemma del prigioniero)?", "options": ["Perché la domanda è orizzontale", "Perché non ci sono barriere all'entrata", "Perché ogni impresa ha interesse individuale a produrre di più e violare l'accordo", "Perché lo Stato li finanzia"], "answer": 2, "explanation": "Cooperare conviene a entrambe, ma barare conviene individualmente: da qui la tensione tra cooperazione e interesse personale.", "ch": 3}, {"q": "Quale affermazione sull'atteggiamento dei poteri pubblici verso gli oligopoli è corretta?", "options": ["Gli accordi sono sempre permessi", "Si cerca che le imprese compitano; ma non ogni accordo è collusivo (es. precio de reventa, venta conjunta)", "Lo Stato impone sempre il prezzo del cartello", "Ogni accordo tra imprese è sempre vietato"], "answer": 1, "explanation": "La slide dice: no todo acuerdo tiene que ser colusivo. Si valutano gli effetti sulla concorrenza.", "ch": 3}, {"q": "Nella competencia monopolística, che cosa succede ai profitti nel lungo periodo?", "options": ["Restano sempre positivi", "Aumentano perché c'è pubblicità", "Tendono a zero per la libera entrata", "Diventano negativi per sempre"], "answer": 2, "explanation": "Profitti > 0 attirano nuove imprese, la domanda di ciascuna scende, finché i profitti scompaiono.", "ch": 3}, {"q": "Quale è un argomento CONTRO la pubblicità secondo il corso?", "options": ["Cambia solo i gusti e differenzia produttori che in realtà sono identici", "Premia chi offre qualità", "Informa sui prezzi", "Aiuta a scegliere meglio"], "answer": 0, "explanation": "Gli argomenti contro: pubblicità psicologica e falsa differenziazione che ostacola la concorrenza.", "ch": 3}, {"q": "Il trasporto pubblico locale, gestito da un solo operatore in concessione, è un esempio di...", "options": ["Concorrenza monopolistica", "Concorrenza perfetta", "Oligopolio", "Monopolio (pubblico o naturale)"], "answer": 3, "explanation": "Un solo operatore, barriere legali ed economie di scala: monopolio.", "ch": 3}, {"q": "Quale definizione di esternalita (externalidad) e corretta?", "options": ["Una decisione di produzione o consumo che influenza altri senza riflettersi nei prezzi di mercato", "Un costo che l'impresa sostiene per pagare i fattori produttivi", "Un'imposta pagata dai consumatori allo Stato", "Un aumento del prezzo dovuto alla scarsita del bene"], "answer": 0, "explanation": "Le slide definiscono l'esternalita come effetto su terzi che non si riflette nei prezzi di mercato (es. fabbrica chimica che rovina la pesca).", "ch": 4}, {"q": "In presenza di esternalita negativa di produzione, la curva del costo sociale (CS) rispetto all'offerta (S) si trova...", "options": ["Sotto S", "Sopra S", "Coincide con S", "Sopra la domanda in ogni punto"], "answer": 1, "explanation": "CS = costo privato + costo esterno, quindi sta sopra S.", "ch": 4}, {"q": "Con un'esternalita negativa di produzione, rispetto all'ottimo sociale il mercato libero produce...", "options": ["Non produce nulla", "Esattamente l'ottimo", "Troppo", "Troppo poco"], "answer": 2, "explanation": "L'impresa non paga il costo esterno, quindi produce Q > Q*: sovrapproduzione.", "ch": 4}, {"q": "Dove si trova l'ottimo sociale in un'esternalita positiva di consumo?", "options": ["Dove D = CS", "Dove D = S", "Dove BS = D", "Dove BS = S"], "answer": 3, "explanation": "Con esternalita positiva di consumo la curva BS sta sopra D e l'ottimo si ha in BS = S, con Q' > Q (sottoproduzione di mercato).", "ch": 4}, {"q": "Quale tra questi e un esempio di esternalita POSITIVA di consumo?", "options": ["Vaccinarsi contro una malattia contagiosa", "Fumare in un'area comune", "Un'azienda che scarica rifiuti in un fiume", "Un locale con musica alta di notte"], "answer": 0, "explanation": "Chi si vaccina riduce il rischio di contagio anche per gli altri: beneficio per terzi non pagato.", "ch": 4}, {"q": "Un apicoltore pone gli alveari accanto a un frutteto e le api impollinano gli alberi del vicino senza compenso. Che tipo di esternalita e?", "options": ["Negativa di consumo", "Negativa di produzione", "Positiva di consumo", "Positiva di produzione"], "answer": 3, "explanation": "E un'attivita produttiva (le api/il miele) che avvantaggia un terzo: esternalita positiva di produzione.", "ch": 4}, {"q": "Quale delle seguenti NON e una soluzione privata alle esternalita secondo le slide?", "options": ["Contratti tra le parti", "Integrazione di imprese", "Permessi trasferibili di inquinamento imposti dallo Stato", "Codici morali o sanzioni sociali"], "answer": 2, "explanation": "I permessi trasferibili sono una soluzione pubblica basata sul mercato; le altre sono soluzioni private.", "ch": 4}, {"q": "Secondo il Teorema di Coase, un'esternalita si risolve in modo efficiente tramite negoziazione se...", "options": ["Esiste un solo consumatore", "L'imposta e uguale al prezzo", "I costi di transazione sono nulli e i diritti sono ben definiti", "Lo Stato assegna i diritti all'inquinatore"], "answer": 2, "explanation": "Coase richiede negoziazione senza costi (e diritti chiari). Allora il risultato e efficiente qualunque sia la distribuzione iniziale dei diritti.", "ch": 4}, {"q": "Una fabbrica guadagna 100 euro inquinando; il danno per un pescatore e 60 euro. Secondo Coase, con costi di transazione nulli, che cosa succede?", "options": ["Serve per forza un'imposta", "La fabbrica non inquina mai", "Dipende da chi ha i diritti: il risultato efficiente cambia", "La fabbrica inquina, indipendentemente da chi ha i diritti, e cambia solo chi paga"], "answer": 3, "explanation": "Beneficio 100 > danno 60: l'inquinamento e efficiente. Se il diritto e del pescatore la fabbrica compra il permesso (tra 60 e 100); se e della fabbrica il pescatore non puo comprare la rinuncia. Stesso esito.", "ch": 4}, {"q": "Quale NON e una ragione per cui la soluzione di Coase spesso fallisce?", "options": ["Elevati costi di transazione", "Diritti di proprieta non definiti", "Molti soggetti colpiti in modo diffuso", "Il fatto che il danno sia pagato dal prezzo di mercato"], "answer": 3, "explanation": "Le cause indicate nelle slide sono: costi di transazione, soggetti diffusi, diritti non ben definiti. Se il danno fosse nel prezzo non ci sarebbe esternalita.", "ch": 4}, {"q": "Qual e il valore ottimale di un'imposta pigouviana?", "options": ["Il prezzo di mercato", "Il danno marginale esterno nel punto ottimo Q*", "La perdita secca totale", "Il profitto dell'impresa"], "answer": 1, "explanation": "L'imposta pigouviana ottimale e pari al costo (danno) marginale esterno valutato all'ottimo sociale.", "ch": 4}, {"q": "Esercizio: S = 2Q, D = 30 - Q, costo sociale CS = 4Q (curva del costo marginale sociale). Quali sono Q di mercato e Q* ottimo?", "options": ["Q = 10 e Q* = 6", "Q = 10 e Q* = 7,5", "Q = 15 e Q* = 7,5", "Q = 6 e Q* = 10"], "answer": 0, "explanation": "Mercato: 2Q = 30 - Q, Q = 10. Ottimo: 30 - Q = 4Q, Q* = 6. Perdita secca = 1/2 x (10-6) x (CS(10) - D(10)) = 1/2 x 4 x (40 - 20) = 40.", "ch": 4}, {"q": "Con gli stessi dati (S = 2Q, D = 30 - Q, CS = 4Q), qual e l'imposta pigouviana per unita?", "options": ["4", "12", "20", "6"], "answer": 1, "explanation": "Costo esterno marginale = CS - S = 4Q - 2Q = 2Q; in Q* = 6 vale 12. Verifica: 2Q + 12 = 30 - Q porta a Q = 6.", "ch": 4}, {"q": "Esercizio: S = 2Q, D = 30 - Q, beneficio sociale BS = 30 (orizzontale). Qual e Q' ottimo e quanto vale la perdita secca?", "options": ["Q' = 15 e perdita = 25", "Q' = 15 e perdita = 50", "Q' = 10 e perdita = 50", "Q' = 20 e perdita = 25"], "answer": 0, "explanation": "Ottimo: BS = S, 30 = 2Q, Q' = 15. Mercato: Q = 10, P = 20. Perdita = 1/2 x (15 - 10) x (30 - 20) = 25. Il sussidio pigouviano e BS - D = Q = 15 nell'ottimo.", "ch": 4}, {"q": "Un bene è escludibile (excluible) quando:", "options": ["È fornito dallo Stato", "Il suo uso da parte di uno riduce l'utilità degli altri", "Ha un prezzo uguale a zero", "È possibile impedire che lo utilizzi una persona"], "answer": 3, "explanation": "Excluible = si può impedire l'uso (di solito a chi non paga). La prima opzione definisce la rivalità.", "ch": 5}, {"q": "La TV via cavo (con abbonamento) è un:", "options": ["Bene privato", "Bene di club / monopolio naturale", "Bene pubblico", "Risorsa comune"], "answer": 1, "explanation": "Escludibile (si paga l'abbonamento) e non rivale (uno spettatore in più non toglie nulla agli altri).", "ch": 5}, {"q": "Un faro che guida le navi in mare è un:", "options": ["Bene di club", "Bene pubblico", "Bene privato", "Risorsa comune"], "answer": 1, "explanation": "Non si può escludere nessuna nave e l'uso di una non riduce quello delle altre: non escludibile e non rivale.", "ch": 5}, {"q": "Una spiaggia libera ad agosto, affollatissima, è:", "options": ["Risorsa comune", "Bene di club", "Bene privato", "Bene pubblico"], "answer": 0, "explanation": "Non escludibile ma rivale: ogni persona in più riduce spazio e qualità per gli altri (come nella slide).", "ch": 5}, {"q": "Il problema del free rider (polizón) consiste nel fatto che:", "options": ["Chi non paga non può essere escluso, quindi ognuno ha interesse a non pagare", "Nessuno vuole consumare il bene", "I prezzi sono troppo alti", "Lo Stato produce troppo"], "answer": 0, "explanation": "Per i beni non escludibili conviene aspettare che paghino gli altri; se tutti ragionano così il bene non viene prodotto o ne viene prodotto troppo poco.", "ch": 5}, {"q": "I beni pubblici sono legati a un'esternalità:", "options": ["Positiva, quindi se ne produce troppo", "Positiva, quindi se ne produce troppo poco", "Negativa, quindi se ne produce troppo", "Negativa, quindi se ne produce troppo poco"], "answer": 1, "explanation": "Chi paga genera benefici per gli altri non compensati: esternalità positiva, il mercato produce meno del livello efficiente.", "ch": 5}, {"q": "Una scuola statale con posti limitati e iscrizione è, in senso economico:", "options": ["Bene pubblico perché fornita dallo Stato", "Bene pubblico locale", "Bene privato (escludibile e rivale)", "Risorsa comune"], "answer": 2, "explanation": "Pubblico in economia non significa fornito dallo Stato: qui si può escludere e i posti sono limitati.", "ch": 5}, {"q": "La tragedia dei beni comunali (tragedia de los bienes comunales) indica che le risorse comuni:", "options": ["Sono sempre gestite meglio dal mercato", "Sono utilizzate più di quanto socialmente desiderabile", "Non hanno nessun valore economico", "Sono prodotte in quantità insufficiente"], "answer": 1, "explanation": "Ognuno incassa il beneficio dell'uso ma il costo (meno risorsa) è condiviso: esternalità negativa e sovrasfruttamento.", "ch": 5}, {"q": "Quale NON è una soluzione indicata per le risorse comuni?", "options": ["Permessi d'uso", "Imposte pigouviane", "Lasciare che ognuno la usi liberamente senza regole", "Regolazione"], "answer": 2, "explanation": "Le soluzioni sono privatizzare, regolare, imposte pigouviane e permessi d'uso. L'uso libero è proprio la causa del problema.", "ch": 5}, {"q": "Una strada urbana senza traffico e un'altra congestionata nell'ora di punta sono rispettivamente:", "options": ["Bene pubblico e risorsa comune", "Bene privato e bene di club", "Risorsa comune e bene pubblico", "Bene di club e bene privato"], "answer": 0, "explanation": "Senza traffico non c'è rivalità (non escludibile e non rivale: pubblico); con la congestione diventa rivale (risorsa comune).", "ch": 5}, {"q": "Perché l'analisi costi-benefici dello Stato per un bene pubblico ha informazione poco affidabile?", "options": ["Perché per il problema del free rider i cittadini non rivelano sinceramente quanto valutano il bene", "Perché i costi sono sconosciuti", "Perché i beni pubblici non hanno benefici", "Perché lo Stato non può mai misurare nulla"], "answer": 0, "explanation": "Ognuno ha interesse a dichiarare un beneficio basso per pagare meno, quindi l'informazione sul beneficio non è affidabile.", "ch": 5}, {"q": "Quale esempio è un bene pubblico?", "options": ["La pesca nell'oceano", "La radio in chiaro", "Una t-shirt", "Un abbonamento a una palestra con posti limitati"], "answer": 1, "explanation": "La radio in chiaro non è escludibile e non è rivale. La t-shirt è privata, la pesca una risorsa comune, la palestra un bene privato/di club.", "ch": 5}];
const CHAPS = ["Benessere e fallimenti", "Monopolio", "Oligopolio e conc. monopolistica", "Esternalità", "Beni pubblici e comuni"];
let filter = 'all', order = DATA.map((_,i)=>i), right=0, answered=0;
const $ = s=>document.querySelector(s);
function renderFilters(){
  const f=$('#filters'); f.innerHTML='';
  [['all','Tutti ('+DATA.length+')'],...CHAPS.map((c,i)=>[String(i+1),c])].forEach(([k,l])=>{
    const b=document.createElement('button'); b.className='chip'+(filter===k?' on':''); b.textContent=l;
    b.onclick=()=>{filter=k;render();}; f.appendChild(b);
  });
}
function render(){
  renderFilters(); right=0; answered=0;
  const list=$('#list'); list.innerHTML='';
  const items=order.filter(i=>filter==='all'||String(DATA[i].ch)===filter);
  items.forEach((i,n)=>{
    const d=DATA[i], el=document.createElement('div'); el.className='q';
    el.innerHTML='<div class="tag">'+(n+1)+' · '+CHAPS[d.ch-1]+'</div><h3></h3>';
    el.querySelector('h3').textContent=d.q;
    d.options.forEach((o,j)=>{
      const b=document.createElement('button'); b.className='opt'; b.textContent=String.fromCharCode(65+j)+') '+o;
      b.onclick=()=>{
        el.classList.add('done'); answered++;
        el.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true; if(k===d.answer)x.classList.add('ok');});
        if(j===d.answer) right++; else b.classList.add('ko');
        upd(items.length);
      };
      el.appendChild(b);
    });
    const e=document.createElement('div'); e.className='exp'; e.textContent=d.explanation; el.appendChild(e);
    list.appendChild(el);
  });
  upd(items.length);
}
function upd(t){$('#score').textContent='Corrette: '+right+' / '+answered+'  ·  Totale domande: '+t;}
$('#shuffle').onclick=()=>{order.sort(()=>Math.random()-.5);render();window.scrollTo(0,0);};
$('#reset').onclick=()=>{order=DATA.map((_,i)=>i);render();window.scrollTo(0,0);};
render();
</script>
</body>
</html>
